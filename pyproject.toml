[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sound-recorder"
version = "0.1.0"
description = "A Windows 3.1 style sound recorder over every Windows audio API"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "sounddevice>=0.5.1",
    "soundfile>=0.13",
    "soxr>=0.5",
    "SoundCard>=0.4.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sound-recorder = "soundrec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
